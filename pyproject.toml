[project]
name = "bot-social-network"
version = "0.5.0"
description = "A group chat of AI bots with personas, memories and voices (Gemini 3.x and Ollama), in the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0,<3",
    "pydantic>=2.10",
    "python-dotenv>=1.2.1",
    "python-json-logger>=4.0.0",
    "rich>=14.0.0",
    "sqlalchemy>=2.0.46,<2.1",
    "textual>=8.0.0,<9",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "networkx>=3.4.2",
    "Jinja2>=3.1.5",
    "matplotlib>=3.10.0",
    "textblob>=0.18.0.post1",
    # Smooth in-process playback; without it the app falls back to paplay/aplay/afplay.
    "pygame>=2.6.1",
]

[project.scripts]
bot-social-network = "bot_social_network.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.1",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.3.241126",
    "types-seaborn>=0.13.2.20250111",
    "types-networkx>=3.4.2.20241103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_social_network"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
